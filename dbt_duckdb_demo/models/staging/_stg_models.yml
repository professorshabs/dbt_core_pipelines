version: 2

models:
  - name: stg_customers
    description: "Cleaned and standardized customer records."
    columns:
      - name: customer_id
        description: "Primary key for customers."
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Lowercased customer email address."
        data_tests:
          - not_null

  - name: stg_orders
    description: "Cleaned and standardized order records."
    columns:
      - name: order_id
        description: "Primary key for orders."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: "Current fulfillment state of the order."
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']

  - name: stg_payments
    description: "Cleaned payment transactions converted from cents to dollars."
    columns:
      - name: payment_id
        description: "Primary key for payments."
        data_tests:
          - unique
          - not_null
      - name: payment_method
        description: "Payment instrument used."
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'gift_card', 'bank_transfer']

