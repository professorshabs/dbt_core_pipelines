name: 'dbt_duckdb_demo'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project (see profiles.yml).
profile: 'dbt_duckdb_demo'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  dbt_duckdb_demo:
    +schema: raw

models:
  dbt_duckdb_demo:
    staging:
      +materialized: view
    marts:
      +materialized: table
